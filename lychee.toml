# Shared Lychee link checker config for Solo docs sites
# https://lychee.cli.rs/guides/config/

exclude = [
  # Static assets
  "^#$",
  ".*apple-touch-icon.*",
  ".*favicon.*",
  ".*\\.json",
  ".*site\\.webmanifest.*",
  ".*style\\.min\\..*",

  # Example/placeholder URLs
  ".*example\\.(com|org)",
  ".*another\\.(com|org)",
  "https?://example\\.com.*",
  "https?://localhost.*",

  # CI build paths (Hugo sometimes embeds workspace paths in asset URLs)
  # Only excludes http(s) URLs — file:// URLs are lychee's local link resolution and should be checked
  "https?://[^/]+/home/runner/",

  # Internal ports commonly used in docs examples (Vault, Envoy admin, etc.)
  ".*:8200.*",
  ".*:9080.*",

  # Internal/private hostnames
  ".*127\\..*",
  ".*\\.local[:/].*",
  ".*\\.local$",
  ".*prometheus-server.*",

  # Example config values (not real URLs)
  "https?://istiod.istio-system.svc:15012",
  "https?://proxy\\.kagent\\.svc\\.cluster\\.local:8080",
  "https?://thanos-querier\\.openshift-monitoring\\.svc[^/]*",

  # Product deployments
  "http://agentgateway-enterprise-controller.kagent*",

  # External services that block or rate-limit link checkers
  ".*api\\.ai\\.prod\\.eu-central-1\\.aws\\.ml\\.hana\\.ondemand\\.com.*",
  ".*app\\.excalidraw.*",
  "^https?://devin\\.ai/desktop$",                    # marketing page returns 429 to checkers; docs.devin.ai is not excluded and still checked
  ".*docs\\.vllm\\.ai.*",
  ".*management\\.azure\\.com.*",
  ".*storage\\.googleapis.*",
  ".*twitter\\.com/soloio_inc.*",
  "https?://aistudio.google.com/app/apikey",
  "https?://console.mistral.ai/",
  "https?://slack.solo.io/",
  "https://www.linkedin.com/*",

  # Open Source Attribution: Go module URLs (pkg.go.dev), not HTTP docs
  "https?://istio\\.io/(api|client-go|istio)",
  "https?://k8s\\.io/",

  # Istio release index (valid but often timeouts or rate-limits in CI)
  "https?://istio\\.io/latest/news/releases/?$",

  # Gloo Mesh (OSS) version switcher links to Gloo Mesh Enterprise docs; expected cross-product links.
  # Scoped to the OSS product path so the remap can still resolve internal GME links to local files.
  "https?://docs\\.solo\\.io/gloo-mesh/.*gloo-mesh-enterprise/",

  # Specific URLs excluded by content team
  ".*articles/4414409064596.*",

  # JavaScript-rendered or SPA-routed anchors that lychee can't see in static HTML.
  # The pages load and the anchors work in browsers, but lychee's static parser
  # finds no matching id="..." because the section IDs are added by JS at runtime.
  # Scope these patterns narrowly — many docs sites expose most anchors statically,
  # so broad per-domain excludes would hide real broken anchors.
  "^https?://kubernetes\\.io/docs/tasks/tools/#",                              # tab-rendered tool anchors
  "^https?://console\\.aws\\.amazon\\.com/.+#/",                               # AWS console SPA hash routing
  "reference/api-kubespec/(policies|backends|parameters)/?#",                  # agentgateway CRD kubespec widget: dotted-path fragments (e.g. #spec.backend.auth.jwtSign) live in a data-ks-path attribute and are resolved client-side via location.hash + a lookup table (selectHashTarget), not a static id="..." lychee's parser can see

  # Always-redirecting URLs that are intentionally short-form / canonical:
  # we want to keep the source URL because it auto-resolves to the latest target.
  "^https?://github\\.com/[^/]+/[^/]+/releases/latest$",  # always redirects to current release tag
  "^https?://discord\\.gg/",                              # canonical short form, redirects to discord.com/invite/
  "^https?://github\\.com/user-attachments/assets/",      # redirects to time-limited S3 signed URLs
  "^https?://github\\.com/[^/]+\\.png$",                  # GitHub user avatar short form (e.g. /craigbox.png), redirects to the avatars CDN URL, which embeds a numeric user ID and a version query that both change when the user updates their avatar
  "^https?://slack\\.cncf\\.io/",                         # CNCF Slack canonical invite, redirects to communityinviter
  "^https?://cloud-native\\.slack\\.com/archives/",       # Slack channel links redirect to a login/auth page
  "^https?://git\\.k8s\\.io/",                            # Kubernetes vanity redirector: every path 302s to github.com/kubernetes/<repo>/blob/main/. These URLs come from k8s.io/apimachinery TypeMeta godoc, so every CRD reference regeneration reintroduces them across agentgateway, kgateway, kagent, and the hub. Excluded rather than rewritten because the short form survives default-branch renames (master -> main already broke the pinned form once), and a stale blob/main URL 404s, which is worse than a redirect
  "^https?://agentgateway\\.dev/schema/config$",          # canonical short form used in $schema config examples, redirects to raw.githubusercontent config.json
  "^https?://modelcontextprotocol\\.io/specification$",   # canonical "current spec" pointer, redirects to the latest dated spec (e.g. /specification/2025-11-25)
  "^https?://modelcontextprotocol\\.io/?$",               # site root, redirects to the latest dated docs intro (e.g. /docs/2026-07-28/getting-started/intro); the root is the stable form to cite
  "^https?://docs\\.crewai\\.com/[a-z]{2}/",              # version-less docs URL (lang-first, e.g. /en/) redirects to the current version (e.g. /v1.15.4/en/); versioned URLs are NOT excluded so stale pins still get flagged

  # Theme logo link (relLangURL "") produces a relative href like "agentgateway/"
  # which lychee resolves to a path ending in the bare product name. This also
  # catches Mermaid diagram text that lychee misinterprets as links.
  "agentgateway/?$",
  "agentregistry/?$",
  "gateway/?$",
  "gloo-mesh-enterprise/?$",
  "gloo-mesh-gateway/?$",
  "istio/?$",
  "kgateway/?$",
]



exclude_path = [
  ".*categories/index.html",
  ".*tags/index.html",
]

# Exclude all private IPs (localhost, 127.0.0.1, etc.)
exclude_all_private = true

# Accepted HTTP status codes (3xx not included - redirects will be reported)
accept = ["100..=103", "200..=299", "403", "502", "503"]

# In lychee >= 0.24, this is a string enum: none|anchor-only|text-only|full.
# "anchor-only" matches the legacy boolean-true behavior (check #section anchors,
# skip text fragments like #:~:text=...).
include_fragments = "anchor-only"

verbose = "debug"

no_progress = true

# Network behavior. The default 128-concurrent setting overwhelms some upstream
# docs hosts (kubernetes.io, cert-manager.io, opentelemetry.io) and causes
# connection drops that lychee reports as errors. Lower concurrency, longer
# timeouts, and more retries with longer waits give those sites room to respond.
timeout = 30
max_concurrency = 16
max_retries = 5
retry_wait_time = 5
host_request_interval = "2s"
